server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: maya-fashion-assistant

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/maya_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

storage:
  location: ${IMAGE_STORAGE_PATH:./uploads/images}

ai:
  provider: ${AI_PROVIDER:MOCK} # MOCK, OPENAI, GEMINI
  api-key: ${AI_API_KEY:}
  base-url: ${AI_BASE_URL:https://api.openai.com/v1}
  model: ${AI_MODEL:gpt-4o-mini}
  vision-model: ${AI_VISION_MODEL:gpt-4o-mini}
  image-gen:
    provider: ${IMAGE_GENERATION_PROVIDER:MOCK} # MOCK, OPENAI
    api-key: ${IMAGE_GENERATION_API_KEY:}
    model: ${IMAGE_GENERATION_MODEL:dall-e-3}

weather:
  provider: ${WEATHER_PROVIDER:OPEN_METEO} # OPEN_METEO, WEATHER_API, MOCK
  base-url: ${WEATHER_BASE_URL:https://api.open-meteo.com/v1}
  api-key: ${WEATHER_API_KEY:}
  default-city: ${WEATHER_DEFAULT_CITY:New York}
  default-lat: ${WEATHER_DEFAULT_LAT:40.7128}
  default-lon: ${WEATHER_DEFAULT_LON:-74.0060}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
