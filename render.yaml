# Render blueprint — one-click deploy of the single MAYA container.
# Docs: https://render.com/docs/blueprint-spec
#
# After connecting the repo, set the AI_API_KEY secret in the Render dashboard
# (get a free key at https://aistudio.google.com/apikey).
services:
  - type: web
    name: maya-fashion-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      # Free Google Gemini key (vision + styling). Marked sync:false so Render
      # prompts you for it instead of storing it in the repo.
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-flash-lite-latest
      - key: AI_VISION_MODEL
        value: gemini-flash-lite-latest
      - key: AI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.5-flash-lite,gemini-3.6-flash,gemini-3.8-flash
      - key: AI_REASONING_EFFORT
        value: low
      # Garment cutouts run in the separate 'maya-segmenter-jatyamanasvini' service below.
      # After both deploy, confirm this matches the segmenter's real URL.
      - key: MAYA_SEGMENTATION_REMOTE_URL
        value: https://maya-segmenter-jatyamanasvini.onrender.com
      - key: MAYA_SEGMENTATION_ENABLED
        value: "false"
      - key: JWT_SECRET
        generateValue: true

  # Tiny Python service that only does the garment cutouts (fits in 512 MB on its own).
  - type: web
    name: maya-segmenter-jatyamanasvini
    runtime: docker
    plan: free
    dockerfilePath: ./segmentation-service/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MAYA_SEG_MODEL
        value: lite
